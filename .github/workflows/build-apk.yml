name: Compilar APK de Mediclic

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Instalar Capacitor
        run: npm install

      - name: Copiar la app web a la carpeta www
        run: |
          rm -rf www
          mkdir www
          cp -r index.html manifest.json sw.js css js icons www/

      - name: Crear el proyecto Android
        run: |
          npx cap add android
          npx cap sync android

      - name: Aplicar permisos, ícono y pantalla de arranque de Mediclic
        run: python3 android-patch/aplicar.py android

      - name: Aceptar licencias del SDK de Android
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true

      - name: Compilar el APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Preparar el archivo
        run: cp android/app/build/outputs/apk/debug/app-debug.apk Mediclic.apk

      - name: Guardar el APK (descargable desde Actions)
        uses: actions/upload-artifact@v4
        with:
          name: Mediclic-APK
          path: Mediclic.apk

      - name: Publicar el APK en Releases (descarga directa desde el celular)
        continue-on-error: true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: Mediclic APK ${{ github.run_number }}
          files: Mediclic.apk
